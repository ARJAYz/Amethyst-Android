name: Android CI

on:
  pull_request:
    branches-ignore:
      - 'l10n_v3_openjdk' 
    types: [ opened, reopened ]
  push:
    branches-ignore:
      - 'l10n_v3_openjdk'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      GPLAY_KEYSTORE_PASSWORD: ${{ secrets.GPLAY_KEYSTORE_PASSWORD }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Get JRE 8
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: app_pojavlauncher/src/main/assets/components/jre
          workflow_conclusion: completed
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre8
          name: jre8-pojav

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          gradle-version: "9.6.1"

      - name: Download Our Place Craft modpack
        run: |
          mkdir -p app_pojavlauncher/src/main/assets/opc
          if curl -fL --retry 3 -o app_pojavlauncher/src/main/assets/opc/modpack.mrpack "https://github.com/${{ github.repository }}/releases/download/pack/modpack.mrpack"; then
            ls -lh app_pojavlauncher/src/main/assets/opc/modpack.mrpack
          else
            echo "::warning::Release 'pack' with modpack.mrpack not found - building APK without the modpack"
            rm -f app_pojavlauncher/src/main/assets/opc/modpack.mrpack
          fi

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost || true

      - name: Run scripts
        run: |
          ./scripts/languagelist_updater.sh
          mkdir out

      - name: Build Debug .apk
        run: |
          set -o pipefail
          gradle :app_pojavlauncher:assembleDebug 2>&1 | tee build.log
          mv app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/app-debug.apk

      - name: Gen md5sums
        run: |
          md5sum out/app-debug.apk > out/app-debug.md5

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: OurPlaceCraft-apk
          path: out/app-debug.*

      # Our Place Craft: on failure, publish the end of the build log to the
      # "ci-log" branch so it can be read without opening the Actions page.
      - name: Publish build log on failure
        if: failure()
        run: |
          mkdir -p /tmp/cilog && cd /tmp/cilog
          git init -q && git checkout -q -b ci-log
          { echo "run: ${{ github.run_id }}"; grep -n -E "error:|e: |FAILURE|What went wrong|Caused by|AAPT|wrong" -A3 "$GITHUB_WORKSPACE/build.log" | head -300; echo "----- tail -----"; tail -150 "$GITHUB_WORKSPACE/build.log"; } > build-log.txt 2>/dev/null || echo "no build.log" > build-log.txt
          git add build-log.txt
          git -c user.name=ci -c user.email=ci@local commit -qm "build log ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-log
